services:
  - type: web
    name: detecthand-dashboard
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz/
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: detecthand-database
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: detecthand-database
    plan: free
    region: singapore
